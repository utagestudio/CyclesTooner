schema_version = "1.0.0"

id = "cycles_tooner"
# Keep in sync with ADDON_VERSION_STRING in __init__.py
version = "1.28.0-dev.2"
name = "CyclesTooner"
tagline = "Convert EEVEE toon avatars to Toon BSDF for Cycles"
maintainer = "utagestudio"
type = "add-on"
website = "https://utagestudio.github.io/CyclesTooner/"
tags = ["Material", "Render"]
blender_version_min = "4.5.0"
license = ["SPDX:GPL-3.0-or-later"]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/_temp/",
  "/.agents/",
  "/.codex/",
  "/.github/",
  "/.gitignore",
  "/.claude/",
  "/AGENTS.md",
  "/AGENTS.local.md",
  "/CLAUDE.md",
  "/docs/",
  "/VERSIONING.md",
]
