<!doctype html>
<!--
  Source for the GitHub Pages Open Graph images.
  Render at 1200x630 and save as .github/pages/assets/og-image-en.png and
  og-image-ja.png. Open with ?lang=ja for the Japanese version. See README.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CyclesTooner OGP</title>
  <link rel="stylesheet" href="../pages/assets/site.css">
  <style>
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .og {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 630px;
      padding: 44px 56px 52px;
    }

    .og .brand {
      display: flex;
      align-items: center;
      font-size: 1.6rem;
    }

    .og .brand-mark {
      width: 1.9rem;
      height: 1.9rem;
    }

    .og-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 440px;
      gap: 44px;
      align-items: center;
    }

    .og .eyebrow {
      margin: 0 0 1.1rem;
      font-size: 1rem;
    }

    .og h1 {
      margin: 0 0 1.4rem;
      font-size: 3.35rem;
      line-height: 1.05;
    }

    .og h1 span {
      display: block;
      white-space: nowrap;
    }

    :lang(ja) .og h1 {
      font-size: 3.05rem;
      line-height: 1.2;
    }

    .og-lede {
      margin: 0;
      color: var(--soft);
      font-size: 1.3rem;
      line-height: 1.55;
      line-break: strict;
    }

    :lang(ja) .og-lede {
      word-break: keep-all;
    }

    .og-lede strong {
      color: var(--lime);
    }

    .og .viewport-frame {
      min-height: 0;
    }

    .og .viewport-frame img {
      display: block;
      width: 100%;
      height: 330px;
      object-fit: cover;
      object-position: center top;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>CyclesTooner</span>
    </div>
    <div class="og-body">
      <div>
        <p class="eyebrow" data-en="Blender toon shader assistant for Cycles" data-ja="BlenderのCycles向けトゥーンシェーダー補助アドオン"></p>
        <h1 data-en="&lt;span&gt;Cycles toon rendering,&lt;/span&gt;&lt;span&gt;without rebuilding&lt;/span&gt;&lt;span&gt;every material.&lt;/span&gt;" data-ja="&lt;span&gt;マテリアルを作り直さず、&lt;/span&gt;&lt;span&gt;Cyclesでトゥーン表現へ。&lt;/span&gt;"></h1>
        <p class="og-lede" data-en="Convert EEVEE toon avatars from &lt;strong&gt;VRM, MMD, VRToon, and UnityToon&lt;/strong&gt; to Toon BSDF, and add outlines for Cycles." data-ja="&lt;strong&gt;VRM・MMD・VRToon・UnityToon&lt;/strong&gt;の&lt;wbr&gt;EEVEE向けトゥーンアバターを&lt;wbr&gt;Toon BSDFへ変換し、&lt;wbr&gt;Cycles向けのアウトラインも生成。"></p>
      </div>
      <div class="viewport-frame">
        <div class="viewport-toolbar">
          <span></span><span></span><span></span>
        </div>
        <img src="../pages/assets/material-converter.png" alt="">
      </div>
    </div>
  </div>
  <script>
    const lang = new URLSearchParams(location.search).get("lang") === "ja" ? "ja" : "en";
    document.documentElement.lang = lang;
    for (const element of document.querySelectorAll("[data-en]")) {
      element.innerHTML = element.dataset[lang];
    }
  </script>
</body>
</html>
