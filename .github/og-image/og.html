<!doctype html>
<!--
  Source for the GitHub Pages Open Graph images.
  Render at 1200x630 and save as .github/pages/assets/og-image-en.png and
  og-image-ja.png. Open with ?lang=ja for the Japanese version. See README.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CyclesTooner OGP</title>
  <link rel="stylesheet" href="../pages/assets/site.css">
  <style>
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .og {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 630px;
      padding: 44px 56px 52px;
    }

    .og .brand {
      display: flex;
      align-items: center;
      font-size: 1.6rem;
    }

    .og .brand-mark {
      width: 1.9rem;
      height: 1.9rem;
    }

    .og-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 440px;
      gap: 44px;
      align-items: center;
    }

    .og .eyebrow {
      margin: 0 0 1.1rem;
      font-size: 1rem;
    }

    .og h1 {
      margin: 0 0 1.4rem;
      font-size: 3.35rem;
      line-height: 1.05;
    }

    .og h1 span {
      display: block;
      white-space: nowrap;
    }

    :lang(ja) .og h1 {
      font-size: 3.05rem;
      line-height: 1.2;
    }

    .og-lede {
      margin: 0;
      color: var(--soft);
      font-size: 1.3rem;
      line-height: 1.55;
      line-break: strict;
    }

    :lang(ja) .og-lede {
      word-break: keep-all;
    }

    .og-lede strong {
      color: var(--magenta);
    }

    .og .viewport-frame {
      min-height: 0;
    }

    /* A still of the hero slider at its initial 50% position. */
    .og .ba-hint {
      display: none;
    }

    .og .ba-label {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>CyclesTooner</span>
    </div>
    <div class="og-body">
      <div>
        <p class="eyebrow" data-en="For VRM and MMD avatars in Cycles" data-ja="VRM・MMDのアバターを、Cyclesで"></p>
        <h1 data-en="&lt;span&gt;Cycles toon rendering,&lt;/span&gt;&lt;span&gt;without rebuilding&lt;/span&gt;&lt;span&gt;every material.&lt;/span&gt;" data-ja="&lt;span&gt;マテリアルを作り直さず、&lt;/span&gt;&lt;span&gt;Cyclesでトゥーン表現へ。&lt;/span&gt;"></h1>
        <p class="og-lede" data-en="Water reflections, dappled sunlight, fisheye lenses. Bring your &lt;strong&gt;VRM and MMD&lt;/strong&gt; avatars into the light and shadow of Cycles." data-ja="水面の反射も、&lt;wbr&gt;木漏れ日も、&lt;wbr&gt;魚眼レンズも。&lt;wbr&gt;&lt;strong&gt;VRMやMMD&lt;/strong&gt;のアバターを、&lt;wbr&gt;Cyclesの光と影の中へ。"></p>
      </div>
      <div class="viewport-frame">
        <div class="viewport-toolbar">
          <span></span><span></span><span></span>
        </div>
        <div class="ba" style="--pos: 50%">
          <img class="ba-before" src="../pages/assets/hero-eevee.webp" alt="">
          <img class="ba-after" src="../pages/assets/hero-cycles.webp" alt="">
          <span class="ba-label ba-label-before">EEVEE · MToon</span>
          <span class="ba-label ba-label-after">Cycles · CyclesTooner</span>
          <span class="ba-handle"></span>
        </div>
      </div>
    </div>
  </div>
  <script>
    const lang = new URLSearchParams(location.search).get("lang") === "ja" ? "ja" : "en";
    document.documentElement.lang = lang;
    for (const element of document.querySelectorAll("[data-en]")) {
      element.innerHTML = element.dataset[lang];
    }
    if (lang === "ja") {
      document.querySelector(".ba-label-before").textContent = "EEVEE・MToon";
      document.querySelector(".ba-label-after").textContent = "Cycles・CyclesTooner";
    }
  </script>
</body>
</html>
